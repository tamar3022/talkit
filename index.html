<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת הערכת תלקיט אקדמי</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel to compile JSX inside the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        @media print {
            .print-hidden { display: none !important; }
            .print-mode { background-color: white !important; }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Inline SVG Icons (Replacing lucide-react) ---
        const IconBase = ({ children, className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                {children}
            </svg>
        );
        const Calculator = (p) => <IconBase {...p}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></IconBase>;
        const User = (p) => <IconBase {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconBase>;
        const BookOpen = (p) => <IconBase {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>;
        const Lightbulb = (p) => <IconBase {...p}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></IconBase>;
        const FlaskConical = (p) => <IconBase {...p}><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M14 9.5 13.77 9c-.19-.44-.45-.85-.77-1.22l-2-2.38a2.5 2.5 0 0 0-3.83 0l-2 2.38c-.32.37-.58.78-.77 1.22L4.17 9.5"/></IconBase>;
        const Award = (p) => <IconBase {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></IconBase>;
        const Printer = (p) => <IconBase {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></IconBase>;
        const Info = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></IconBase>;

        // --- Data Definitions ---
        const RANKS = [
          { id: 'lecturer', name: 'מרצה (מסלול מחקרי)', weights: { a: 0.35, b: 0.30, c: 0.30, d: 0.05 } },
          { id: 'senior_lecturer', name: 'מרצה בכיר (מסלול מחקרי)', weights: { a: 0.25, b: 0.30, c: 0.40, d: 0.05 } },
          { id: 'adjunct', name: 'מרצה נלווה', weights: { a: 0.40, b: 0.35, c: 0.20, d: 0.05 } },
          { id: 'senior_adjunct', name: 'מרצה נלווה בכיר', weights: { a: 0.30, b: 0.35, c: 0.30, d: 0.05 } },
        ];

        const SECTION_C_DATA = [
          { id: 'c1', name: 'פרטים מלאים עבור עבודת הדוקטורט', type: 'fixed', value: 5 },
          { id: 'c2', name: 'מאמר בכתב עת אקדמי שפיט בעברית מתוך רשימת ות"ת', type: 'fixed', value: 8 },
          { id: 'c3', name: 'מאמר בכתב עת אקדמי שפיט בעברית שלא ברשימת ות"ת', type: 'fixed', value: 4 },
          { id: 'c4', name: 'מאמר בכתב עת אקדמי שפיט בלועזית בדרוג 1', type: 'fixed', value: 12 },
          { id: 'c5', name: 'מאמר בכתב עת אקדמי שפיט בלועזית בדרוג 2', type: 'fixed', value: 10 },
          { id: 'c6', name: 'מאמר בכתב עת אקדמי שפיט בלועזית בדרוג 3', type: 'fixed', value: 8 },
          { id: 'c7', name: 'מאמר בכתב עת אקדמי שפיט בלועזית בדרוג 4', type: 'fixed', value: 6 },
          { id: 'c8', name: 'מאמר בכתב עת אקדמי שפיט בלועזית ללא דרוג', type: 'fixed', value: 4 },
          { id: 'c9', name: 'מאמר בכתב עת אקדמי לא שפיט בלועזית', type: 'fixed', value: 2 },
          { id: 'c10', name: 'מאמר בכתב עת למורים מקצועי/תורני', type: 'fixed', value: 4 },
          { id: 'c11', name: 'עריכה של כתב עת (עבור עריכה שנתית)', type: 'upto', max: 4 },
          { id: 'c12', name: 'שיפוט של מאמרים בכתב עת אקדמי (עבור מאמר)', type: 'upto', max: 3, perItem: true },
          { id: 'c13', name: 'עריכה של ספר אקדמי (כותבים שונים)', type: 'upto', max: 6 },
          { id: 'c14', name: 'דו"ח מחקר לגוף חוץ-מכללתי', type: 'upto', max: 4 },
          { id: 'c15', name: 'דו"ח מחקר פנים-מכללתי', type: 'upto', max: 2 },
          { id: 'c16', name: 'כתיבת ספר בהוצאה אקדמית', type: 'upto', max: 30 },
          { id: 'c17', name: 'ההדרה מדעית של ספר תשתיתי', type: 'upto', max: 15 },
          { id: 'c18', name: 'תרגום של ספר אקדמי', type: 'upto', max: 12 },
          { id: 'c19', name: 'כתיבת פרק בספר בהוצאה אקדמית', type: 'upto', max: 8 },
          { id: 'c20', name: 'מאמר שפורסם בספר של כנס אקדמי בין-לאומי', type: 'upto', max: 5 },
          { id: 'c21', name: 'הרצאה בכנס אקדמי בחו"ל או כנס בינלאומי בארץ', type: 'fixed', value: 5 },
          { id: 'c22', name: 'הרצאה בכנס אקדמי בארץ', type: 'fixed', value: 4 },
          { id: 'c23', name: 'פוסטר או השתתפות בפאנל בכנס אקדמי', type: 'fixed', value: 3 },
          { id: 'c24', name: 'כתיבת ערך באנציקלופדיה', type: 'upto', max: 5 },
          { id: 'c25', name: 'כתיבת יצירה מוזיקלית / הפקת מופע אומנותי (מחוץ למערכת)', type: 'upto', max: 8 },
          { id: 'c26', name: 'הפקה פומבית של יצירה מוזיקלית / ניצוח (ביצוע ראשון)', type: 'upto', max: 8 },
          { id: 'c27', name: 'הנחייה של תלמידי מחקר לתזה או לדוקטורט', type: 'upto', max: 15 },
          { id: 'c28', name: 'תערוכת ציורים ואומנות פלסטית', type: 'upto', max: 15 },
        ];

        const InputField = ({ label, value, onChange, max, min = 0, note }) => {
          const [localVal, setLocalVal] = useState(value === 0 ? '' : value);
          const [error, setError] = useState(false);

          useEffect(() => {
            setLocalVal(value === 0 ? '' : value);
          }, [value]);

          const handleChange = (e) => {
            const val = e.target.value;
            setLocalVal(val);
            if (val !== '' && Number(val) > max) {
              setError(true);
            } else {
              setError(false);
            }
          };

          const handleBlur = () => {
            let finalVal = parseFloat(localVal);
            if (isNaN(finalVal)) finalVal = 0;
            if (finalVal > max) finalVal = max;
            if (finalVal < min) finalVal = min;
            
            setLocalVal(finalVal === 0 ? '' : finalVal);
            setError(false);
            onChange(finalVal);
          };

          return (
            <div className="flex flex-col mb-4">
              <div className="flex justify-between items-center mb-1">
                <label className="text-sm font-medium text-slate-700">{label}</label>
                <span className="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded print:hidden">עד {max} נק'</span>
              </div>
              {note && <p className="text-xs text-slate-500 mb-2">{note}</p>}
              <input
                type="text"
                value={localVal}
                onChange={handleChange}
                onBlur={handleBlur}
                placeholder="0"
                className={`border rounded-md p-2 focus:outline-none transition-all text-left dir-ltr ${
                  error ? 'border-red-500 ring-2 ring-red-200' : 'border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500'
                } print:border-none print:p-0 print:font-bold print:text-right print:bg-transparent`}
                dir="ltr"
              />
              {error && <span className="text-xs text-red-500 mt-1 print:hidden">שים לב: המקסימום הוא {max}</span>}
            </div>
          );
        };

        const App = () => {
          const [isPrintMode, setIsPrintMode] = useState(false);

          const [candidate, setCandidate] = useState({
            name: '',
            specialization: '',
            currentRank: '',
            rankDate: '',
            targetRank: RANKS[0].id,
            evaluators: '',
            evaluationDate: new Date().toISOString().split('T')[0]
          });

          const [secA, setSecA] = useState({
            a1_degree: 0, a2_expansion: 0, a3_philosophy: 0,
            a4_feedback: 0, a5_students: 0, a6_peers: 0
          });

          const [secB, setSecB] = useState({ b1_dept: 0, b2_college: 0 });

          const [secC, setSecC] = useState(
            SECTION_C_DATA.map(item => ({ id: item.id, count: 0, manualScore: 0 }))
          );

          const [secD, setSecD] = useState(0);

          const totalA = Math.min(100, Object.values(secA).reduce((sum, val) => sum + (Number(val) || 0), 0));
          const totalB = Math.min(100, Object.values(secB).reduce((sum, val) => sum + (Number(val) || 0), 0));
          
          const totalC = Math.min(100, secC.reduce((sum, item) => {
            const dataDef = SECTION_C_DATA.find(d => d.id === item.id);
            if (dataDef.type === 'fixed') {
              return sum + ((Number(item.count) || 0) * dataDef.value);
            } else {
              return sum + (Number(item.manualScore) || 0);
            }
          }, 0));

          const totalD = Math.min(5, Number(secD) || 0);
          const selectedRankDef = RANKS.find(r => r.id === candidate.targetRank);
          
          const finalScore = (totalA * selectedRankDef.weights.a) + 
                             (totalB * selectedRankDef.weights.b) + 
                             (totalC * selectedRankDef.weights.c) + 
                             totalD;

          const handleSecCChange = (id, field, value) => {
            setSecC(prev => prev.map(item => {
              if (item.id === id) {
                const dataDef = SECTION_C_DATA.find(d => d.id === id);
                const updatedItem = { ...item, [field]: value };
                
                if (field === 'count' && dataDef.type === 'upto') {
                  updatedItem.manualScore = value * dataDef.max;
                }
                return updatedItem;
              }
              return item;
            }));
          };

          const handlePrint = () => {
            setIsPrintMode(true);
            setTimeout(() => {
                window.print();
                window.addEventListener('afterprint', () => {
                    setIsPrintMode(false);
                }, { once: true });
            }, 100);
          };

          return (
            <div className={`min-h-screen text-slate-800 ${isPrintMode ? 'print-mode' : ''}`}>
              {!isPrintMode && (
                <header className="bg-blue-900 text-white shadow-md sticky top-0 z-50 print-hidden">
                  <div className="container mx-auto px-4 py-4 flex justify-between items-center">
                    <div className="flex items-center gap-3">
                      <Calculator className="w-6 h-6 text-blue-300" />
                      <h1 className="text-xl font-bold">מערכת הערכת תלקיט אקדמי</h1>
                    </div>
                    <div className="flex items-center gap-4">
                      <div className="bg-blue-800 px-4 py-2 rounded-lg font-mono text-xl border border-blue-700">
                        ציון סופי: <span className="font-bold text-yellow-300">{finalScore.toFixed(2)}</span>
                      </div>
                      <button 
                        onClick={handlePrint}
                        className="bg-emerald-600 text-white hover:bg-emerald-500 p-2 rounded-md flex items-center gap-2 transition-colors font-bold shadow-sm"
                      >
                        <Printer className="w-5 h-5" />
                        <span>הורד כ-PDF</span>
                      </button>
                    </div>
                  </div>
                </header>
              )}

              <main className="container mx-auto px-4 py-8 max-w-5xl">
                <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8 print:shadow-none print:border-none print:mb-4">
                  <div className="flex items-center gap-2 mb-6 border-b border-slate-100 pb-4 print:border-slate-800">
                    <User className="w-5 h-5 text-blue-600 print:text-slate-800" />
                    <h2 className="text-xl font-bold text-slate-800">פרטי המועמד וההערכה</h2>
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">שם המועמד</label>
                      {isPrintMode ? <div className="font-bold pb-1">{candidate.name || '-'}</div> : 
                      <input type="text" value={candidate.name} onChange={e => setCandidate({...candidate, name: e.target.value})} className="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none" />}
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">תחום התמחות</label>
                      {isPrintMode ? <div className="font-bold pb-1">{candidate.specialization || '-'}</div> : 
                      <input type="text" value={candidate.specialization} onChange={e => setCandidate({...candidate, specialization: e.target.value})} className="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none" />}
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">דרגה אקדמית נוכחית</label>
                      {isPrintMode ? <div className="font-bold pb-1">{candidate.currentRank || '-'}</div> : 
                      <input type="text" value={candidate.currentRank} onChange={e => setCandidate({...candidate, currentRank: e.target.value})} className="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none" />}
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">תאריך קבלת הדרגה</label>
                      {isPrintMode ? <div className="font-bold pb-1">{candidate.rankDate || '-'}</div> : 
                      <input type="text" value={candidate.rankDate} onChange={e => setCandidate({...candidate, rankDate: e.target.value})} className="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none" />}
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-blue-700 mb-1 print:text-slate-800">מועמד לדרגה</label>
                      {isPrintMode ? <div className="font-bold pb-1">{selectedRankDef.name}</div> : 
                      <select 
                        value={candidate.targetRank} 
                        onChange={e => setCandidate({...candidate, targetRank: e.target.value})} 
                        className="w-full border border-blue-300 bg-blue-50 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-blue-900"
                      >
                        {RANKS.map(r => (
                          <option key={r.id} value={r.id}>{r.name}</option>
                        ))}
                      </select>}
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">שמות המעריכים</label>
                      {isPrintMode ? <div className="font-bold pb-1">{candidate.evaluators || '-'}</div> : 
                      <input type="text" value={candidate.evaluators} onChange={e => setCandidate({...candidate, evaluators: e.target.value})} placeholder="פרופ' פלוני, ד״ר אלמוני" className="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none" />}
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">תאריך ההערכה</label>
                      {isPrintMode ? <div className="font-bold pb-1">{candidate.evaluationDate ? new Date(candidate.evaluationDate).toLocaleDateString('he-IL') : '-'}</div> : 
                      <input type="date" value={candidate.evaluationDate} onChange={e => setCandidate({...candidate, evaluationDate: e.target.value})} className="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none text-right" />}
                    </div>
                  </div>
                </section>

                <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8 print:shadow-none print:border-slate-800 print:border">
                  <div className="bg-blue-50 border-b border-blue-100 p-4 flex justify-between items-center print:bg-transparent print:border-slate-800">
                    <div className="flex items-center gap-2">
                      <BookOpen className="w-5 h-5 text-blue-600 print:text-slate-800" />
                      <h2 className="text-lg font-bold text-slate-800">פרק א': איכות ההוראה ועיצובה</h2>
                    </div>
                    <div className="text-left">
                      <span className="text-sm text-slate-500">משקל: {selectedRankDef.weights.a * 100}% | סה"כ: </span>
                      <span className={`font-bold ${totalA === 100 ? 'text-green-600' : 'text-blue-700'} print:text-slate-800`}>{totalA.toFixed(1)} / 100</span>
                    </div>
                  </div>
                  <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                      <h3 className="font-bold text-slate-700 mb-4 border-b pb-2">ידע בתחום הדעת (עד 50%)</h3>
                      {isPrintMode ? (
                        <>
                          <div className="flex justify-between mb-2"><span className="text-slate-600">ידע רחב ומעמיק</span><span className="font-bold">{secA.a1_degree || 0} נק'</span></div>
                          <div className="flex justify-between mb-2"><span className="text-slate-600">הרחבת השכלה</span><span className="font-bold">{secA.a2_expansion || 0} נק'</span></div>
                        </>
                      ) : (
                        <>
                          <InputField label="ידע רחב ומעמיק (תארים מתקדמים, דוקטורט)" max={25} value={secA.a1_degree} onChange={val => setSecA({...secA, a1_degree: val})} />
                          <InputField label="הרחבת השכלה (קורסים, כנסים, השתלמויות)" max={25} value={secA.a2_expansion} onChange={val => setSecA({...secA, a2_expansion: val})} />
                        </>
                      )}
                    </div>
                    <div>
                      <h3 className="font-bold text-slate-700 mb-4 border-b pb-2">איכות ההוראה (עד 35%)</h3>
                      {isPrintMode ? (
                        <>
                          <div className="flex justify-between mb-2"><span className="text-slate-600">תפיסת עולם חינוכית, חדשנות</span><span className="font-bold">{secA.a3_philosophy || 0} נק'</span></div>
                          <div className="flex justify-between mb-2"><span className="text-slate-600">משובי סטודנטים</span><span className="font-bold">{secA.a4_feedback || 0} נק'</span></div>
                        </>
                      ) : (
                        <>
                          <InputField label="תפיסת עולם חינוכית, חדשנות ויצירתיות" max={25} value={secA.a3_philosophy} onChange={val => setSecA({...secA, a3_philosophy: val})} />
                          <InputField label="משובי סטודנטים לאיכות הקורס" max={10} value={secA.a4_feedback} onChange={val => setSecA({...secA, a4_feedback: val})} />
                        </>
                      )}
                      
                      <h3 className="font-bold text-slate-700 mt-6 mb-4 border-b pb-2">המרצה מול סטודנטים ועמיתים (עד 15%)</h3>
                      {isPrintMode ? (
                        <>
                          <div className="flex justify-between mb-2"><span className="text-slate-600">יחסים עם סטודנטים</span><span className="font-bold">{secA.a5_students || 0} נק'</span></div>
                          <div className="flex justify-between mb-2"><span className="text-slate-600">שיתוף פעולה בצוות</span><span className="font-bold">{secA.a6_peers || 0} נק'</span></div>
                        </>
                      ) : (
                        <div className="grid grid-cols-2 gap-4">
                          <InputField label="יחסים עם סטודנטים" max={7} value={secA.a5_students} onChange={val => setSecA({...secA, a5_students: val})} />
                          <InputField label="שיתוף פעולה בצוות" max={8} value={secA.a6_peers} onChange={val => setSecA({...secA, a6_peers: val})} />
                        </div>
                      )}
                    </div>
                  </div>
                </section>

                <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8 print:shadow-none print:border-slate-800 print:border">
                  <div className="bg-emerald-50 border-b border-emerald-100 p-4 flex justify-between items-center print:bg-transparent print:border-slate-800">
                    <div className="flex items-center gap-2">
                      <Lightbulb className="w-5 h-5 text-emerald-600 print:text-slate-800" />
                      <h2 className="text-lg font-bold text-slate-800">פרק ב': מעורבות ויוזמות בחוג ובמכללה</h2>
                    </div>
                    <div className="text-left">
                      <span className="text-sm text-slate-500">משקל: {selectedRankDef.weights.b * 100}% | סה"כ: </span>
                      <span className={`font-bold ${totalB === 100 ? 'text-green-600' : 'text-emerald-700'} print:text-slate-800`}>{totalB.toFixed(1)} / 100</span>
                    </div>
                  </div>
                  <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                      <h3 className="font-bold text-slate-700 mb-4 border-b pb-2">ב.1.1 מעורבות בחוג (עד 40%)</h3>
                      {isPrintMode ? (
                        <div className="flex justify-between mb-2"><span className="text-slate-600">מעורבות בחוג</span><span className="font-bold">{secB.b1_dept || 0} נק'</span></div>
                      ) : (
                        <InputField label="חברות בוועדות, פיתוח קורסים, ארגון אירועים בחוג" note="ציון כולל להערכת הפעילות הפנים-חוגית" max={40} value={secB.b1_dept} onChange={val => setSecB({...secB, b1_dept: val})} />
                      )}
                    </div>
                    <div>
                      <h3 className="font-bold text-slate-700 mb-4 border-b pb-2">ב.2.1 מעורבות במערכת ובמכללה (עד 60%)</h3>
                      {isPrintMode ? (
                        <div className="flex justify-between mb-2"><span className="text-slate-600">מעורבות במערכת ובמכללה</span><span className="font-bold">{secB.b2_college || 0} נק'</span></div>
                      ) : (
                        <InputField label="תפקידים מרכזיים, ועדות חוץ, ארגון ימי עיון, פיתוח חומרי עזר" note="ציון כולל להערכת הפעילות הכלל-מכללתית ומחוצה לה" max={60} value={secB.b2_college} onChange={val => setSecB({...secB, b2_college: val})} />
                      )}
                    </div>
                  </div>
                </section>

                <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8 print:shadow-none print:border-slate-800 print:border">
                  <div className="bg-purple-50 border-b border-purple-100 p-4 flex justify-between items-center print:bg-transparent print:border-slate-800">
                    <div className="flex items-center gap-2">
                      <FlaskConical className="w-5 h-5 text-purple-600 print:text-slate-800" />
                      <h2 className="text-lg font-bold text-slate-800">פרק ג': פעילות מחקרית אקדמית</h2>
                    </div>
                    <div className="text-left">
                      <span className="text-sm text-slate-500">משקל: {selectedRankDef.weights.c * 100}% | סה"כ: </span>
                      <span className={`font-bold ${totalC === 100 ? 'text-green-600' : 'text-purple-700'} print:text-slate-800`}>{totalC.toFixed(1)} / 100</span>
                    </div>
                  </div>
                  
                  <div className="p-0 overflow-x-auto">
                    <table className="w-full text-sm text-right">
                      <thead className="bg-slate-50 border-b text-slate-600 print:bg-transparent print:border-slate-800">
                        <tr>
                          <th className="p-3 font-semibold w-1/2 print:border-b print:border-slate-800">סוג הפרסום / הפעילות</th>
                          <th className="p-3 font-semibold text-center w-24 print:border-b print:border-slate-800">ניקוד לפריט</th>
                          <th className="p-3 font-semibold text-center w-24 print:border-b print:border-slate-800">כמות פריטים</th>
                          <th className="p-3 font-semibold text-center w-32 print:border-b print:border-slate-800">ניקוד שניתן</th>
                          <th className="p-3 font-semibold text-center w-24 bg-purple-50 print:bg-transparent print:border-b print:border-slate-800">סה"כ לשורה</th>
                        </tr>
                      </thead>
                      <tbody>
                        {SECTION_C_DATA.map((item) => {
                          const stateItem = secC.find(s => s.id === item.id);
                          const isFixed = item.type === 'fixed';
                          const rowTotal = isFixed 
                            ? (stateItem.count * item.value) 
                            : stateItem.manualScore;

                          if (isPrintMode && rowTotal === 0 && stateItem.count === 0) return null;

                          return (
                            <tr key={item.id} className="border-b hover:bg-slate-50 transition-colors print:border-slate-300">
                              <td className="p-3 text-slate-800">{item.name}</td>
                              <td className="p-3 text-center font-mono text-slate-600">
                                {isFixed ? item.value : `עד ${item.max}`}
                              </td>
                              <td className="p-3 text-center">
                                {isPrintMode ? (stateItem.count || '-') : (
                                  <input 
                                    type="number" min="0" 
                                    className="w-16 border border-slate-300 rounded p-1 text-center focus:ring-1 focus:ring-purple-500 outline-none"
                                    value={stateItem.count === 0 ? '' : stateItem.count}
                                    onChange={(e) => handleSecCChange(item.id, 'count', parseInt(e.target.value) || 0)}
                                    placeholder="0"
                                  />
                                )}
                              </td>
                              <td className="p-3 text-center">
                                {isPrintMode ? (!isFixed ? stateItem.manualScore : '-') : (
                                  !isFixed && (
                                    <input 
                                      type="number" min="0" max={item.max * Math.max(1, stateItem.count)}
                                      className="w-20 border border-slate-300 rounded p-1 text-center focus:ring-1 focus:ring-purple-500 outline-none bg-yellow-50"
                                      value={stateItem.manualScore === 0 && stateItem.count === 0 ? '' : stateItem.manualScore}
                                      onChange={(e) => {
                                          let val = parseFloat(e.target.value) || 0;
                                          let maxAllowed = item.max * Math.max(1, stateItem.count);
                                          if(val > maxAllowed) val = maxAllowed;
                                          handleSecCChange(item.id, 'manualScore', val);
                                      }}
                                      placeholder={`0 - ${item.max * Math.max(1, stateItem.count)}`}
                                    />
                                  )
                                )}
                                {!isPrintMode && isFixed && <span className="text-slate-300">-</span>}
                              </td>
                              <td className="p-3 text-center font-bold text-purple-700 bg-purple-50/50 print:bg-transparent print:text-slate-800">
                                {rowTotal > 0 ? rowTotal : '-'}
                              </td>
                            </tr>
                          )
                        })}
                      </tbody>
                    </table>
                  </div>
                  {!isPrintMode && (
                    <div className="bg-slate-50 p-3 text-xs text-slate-500 flex items-center gap-2">
                      <Info className="w-4 h-4 flex-shrink-0" />
                      <p><strong>שימו לב:</strong> עבור סעיפים מסוג "עד X נקודות", הזנת כמות תחשב אוטומטית את הניקוד המקסימלי האפשרי לאותה כמות. ניתן להפחית ידנית את הציון המוענק בעמודה "ניקוד שניתן". סה"כ הנקודות בפרק יוגבל ל-100.</p>
                    </div>
                  )}
                </section>

                <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8 print:shadow-none print:border-slate-800 print:border">
                  <div className="bg-orange-50 border-b border-orange-100 p-4 flex justify-between items-center print:bg-transparent print:border-slate-800">
                    <div className="flex items-center gap-2">
                      <Award className="w-5 h-5 text-orange-600 print:text-slate-800" />
                      <h2 className="text-lg font-bold text-slate-800">פרק ד': הערכה כללית של התלקיט</h2>
                    </div>
                    <div className="text-left">
                      <span className="text-sm text-slate-500">משקל: 5% (5 נק' מהציון הסופי) | סה"כ: </span>
                      <span className="font-bold text-orange-700 print:text-slate-800">{totalD.toFixed(1)} / 5</span>
                    </div>
                  </div>
                  <div className="p-6">
                    <div className="max-w-md">
                      <label className="block text-sm font-bold text-slate-700 mb-2">ציון התרשמות כללית (הערכה הוליסטית של התיק)</label>
                      {isPrintMode ? (
                        <div className="text-xl font-bold">{secD || 0} מתוך 5</div>
                      ) : (
                        <div className="flex items-center gap-4">
                          <input 
                            type="number" min="0" max="5" step="0.5"
                            className="w-24 border-2 border-orange-200 rounded-lg p-3 text-center text-xl font-bold focus:ring-2 focus:ring-orange-500 outline-none"
                            value={secD === 0 ? '' : secD}
                            onChange={(e) => {
                              let val = parseFloat(e.target.value) || 0;
                              if(val > 5) val = 5;
                              if(val < 0) val = 0;
                              setSecD(val);
                            }}
                            placeholder="0 - 5"
                          />
                          <span className="text-slate-500">נקודות מתוך 5 נקודות אפשריות</span>
                        </div>
                      )}
                    </div>
                  </div>
                </section>

                <section className="bg-slate-800 text-white rounded-xl shadow-lg p-8 mb-16 relative overflow-hidden print:bg-transparent print:text-black print:border-2 print:border-slate-800 print:shadow-none">
                  <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500 opacity-10 rounded-full -translate-y-10 translate-x-10 print:hidden"></div>
                  
                  <h2 className="text-2xl font-bold mb-6 border-b border-slate-600 pb-4 print:border-slate-800">סיכום ציונים ושקלול סופי</h2>
                  
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 text-center">
                    <div className="bg-slate-700 rounded-lg p-4 print:bg-transparent print:border print:border-slate-800">
                      <div className="text-slate-300 text-sm mb-1 print:text-slate-800 font-bold">א. איכות ההוראה</div>
                      <div className="text-2xl font-mono">{totalA.toFixed(1)}</div>
                      <div className="text-xs text-blue-300 mt-1 print:text-slate-600">משקל: {selectedRankDef.weights.a * 100}%</div>
                    </div>
                    <div className="bg-slate-700 rounded-lg p-4 print:bg-transparent print:border print:border-slate-800">
                      <div className="text-slate-300 text-sm mb-1 print:text-slate-800 font-bold">ב. מעורבות ויוזמות</div>
                      <div className="text-2xl font-mono">{totalB.toFixed(1)}</div>
                      <div className="text-xs text-emerald-300 mt-1 print:text-slate-600">משקל: {selectedRankDef.weights.b * 100}%</div>
                    </div>
                    <div className="bg-slate-700 rounded-lg p-4 print:bg-transparent print:border print:border-slate-800">
                      <div className="text-slate-300 text-sm mb-1 print:text-slate-800 font-bold">ג. מחקר אקדמי</div>
                      <div className="text-2xl font-mono">{totalC.toFixed(1)}</div>
                      <div className="text-xs text-purple-300 mt-1 print:text-slate-600">משקל: {selectedRankDef.weights.c * 100}%</div>
                    </div>
                    <div className="bg-slate-700 rounded-lg p-4 print:bg-transparent print:border print:border-slate-800">
                      <div className="text-slate-300 text-sm mb-1 print:text-slate-800 font-bold">ד. התרשמות כללית</div>
                      <div className="text-2xl font-mono">{totalD.toFixed(1)}</div>
                      <div className="text-xs text-orange-300 mt-1 print:text-slate-600">משקל: 5% (ישיר)</div>
                    </div>
                  </div>

                  <div className="flex flex-col md:flex-row justify-between items-center bg-blue-900 p-6 rounded-lg border border-blue-700 print:bg-transparent print:border-2 print:border-slate-800">
                    <div>
                      <p className="text-blue-200 text-sm print:text-slate-800 font-bold">שקלול עבור דרגת מועמדות:</p>
                      <h3 className="text-xl font-bold">{selectedRankDef.name}</h3>
                    </div>
                    <div className="text-left mt-4 md:mt-0">
                      <p className="text-blue-200 text-sm print:text-slate-800 font-bold">ציון סופי למועמד:</p>
                      <div className="text-5xl font-bold text-yellow-400 font-mono print:text-black">
                        {finalScore.toFixed(2)}
                      </div>
                    </div>
                  </div>

                  <div className="mt-12 pt-8 border-t border-slate-600 flex justify-between print:border-slate-800 text-slate-400 print:text-black font-bold">
                     <div>
                        <p>חתימת מעריך 1: _____________________</p>
                     </div>
                     <div>
                        <p>חתימת מעריך 2: _____________________</p>
                     </div>
                     <div>
                        <p>תאריך: {candidate.evaluationDate ? new Date(candidate.evaluationDate).toLocaleDateString('he-IL') : '________________'}</p>
                     </div>
                  </div>
                </section>
              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
